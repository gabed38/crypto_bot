# CONTROL VARIANT — baseline for A/B comparison
#
# Identical to config/config.yaml except for the three things under test:
#   sizing_method:          flat  (vs vol_target)
#   meta_labeling_enabled:  false (vs true)
#
# Everything else — screen, regime rules, cooldown, barriers, the premature-exit
# fix — is shared, so any performance difference is attributable to sizing and
# the secondary model rather than to unrelated drift.
#
# Run:  venv/bin/python scripts/intraday_trader.py --config config/variants/control.yaml
#
# Crypto Trading Bot Configuration

# LLM Configuration
llm:
  provider: anthropic
  model: claude-sonnet-4-6                # Phase 2 — trade discovery (quality matters)
  lite_model: claude-haiku-4-5-20251001   # Phase 3 — post-trade lesson extraction (summarization)
  api_key: ${ANTHROPIC_API_KEY}
  max_tokens: 4000
  temperature: 0.7

# Trading Configuration
trading:
  enabled: false  # Paper trading only
  max_trades_per_run: 5
  max_open_positions: 20
  max_position_size_usd: 5  # Flat $5 per trade
  min_conviction_score: 0.7
  max_positions_per_sector: 4       # Max open positions in any single sector (L1, DeFi, Meme, etc.)
  min_profit_pct: 5.0
  reentry_cooldown_hours: 6         # Block re-entering a coin closed at a loss within this window

  # --- Volatility-targeted sizing ----------------------------------------------
  # Flat $5 meant a 2%/day coin and a 15%/day coin carried wildly different risk
  # for the same notional. Sizing inversely to volatility equalises risk per
  # position — the best-supported single change in the momentum literature.
  sizing_method: flat         # vol_target | flat
  base_position_usd: 5.0            # Stake for a coin sitting exactly at target_vol_pct
  min_position_size_usd: 1.0
  target_vol_pct: 3.0               # Expected daily move a full-size position targets

  # --- Triple-barrier definition -----------------------------------------------
  # Barriers scale with each coin's volatility so they're equally reachable
  # regardless of how violently the coin moves.
  barrier_profit_mult: 2.0          # Take-profit at N x daily volatility
  barrier_stop_mult: 2.0            # Stop-loss at N x daily volatility

  # --- Meta-labeling ------------------------------------------------------------
  # The screen picks the side; the LLM only decides take/skip + size. Until enough
  # uncensored labels accumulate, the secondary model IS the LLM.
  meta_labeling_enabled: false
  meta_min_training_labels: 100     # Uncensored labels needed before fitting a classifier

  # --- Strategy variant ----------------------------------------------------------
  # Tags every trade so parallel variants can be compared without mixing stats.
  strategy_variant: control_flat

# Risk Management
risk:
  max_daily_loss_pct_of_committed: 0.25  # 25% of committed capital (e.g. $12.50 on $50 committed)
  max_daily_loss_floor_usd: 5.0          # Minimum daily loss limit (one full position)
  max_position_percentage: 0.2
  stop_loss_percentage: 0.20             # 20% stop loss
  drawdown_warning_pct: -15.0            # Unrealised drawdown % → be more selective
  drawdown_halt_pct: -25.0               # Unrealised drawdown % → block new trades entirely

# Data Sources (all free)
data_sources:
  coingecko:
    enabled: true
    top_coins: 500  # Top N coins by market cap to fetch (2 pages of 250 from CoinGecko)
  news:
    enabled: true
    sources:
      - rss_feeds  # CoinDesk, CoinTelegraph, Decrypt, Bitcoin Magazine
    max_articles: 60
  fear_greed:
    enabled: true

  # Pre-screen settings
  min_volume_usd: 10000000  # $10M minimum 24h volume — opens mid/small caps for volatile swings
  max_candidates: 25        # Max coins to send to LLM after pre-screen
  min_stop_multiple: 1.5    # Reject coins where 20% stop fires within 1.5 daily moves

# Data locations
# Each strategy variant needs its own state directories. Two variants sharing an
# open_positions.json would close each other's trades under the wrong exit rules.
# Calibration/meta-model files are intentionally NOT listed here — they're keyed
# by variant internally, so one shared file lets refit_models.py compare variants.
data:
  positions_dir: data/variants/control/positions
  performance_dir: data/variants/control/performance
  trades_dir: data/variants/control/trades

# Logging
logging:
  level: INFO
  log_to_file: true
  log_dir: logs
